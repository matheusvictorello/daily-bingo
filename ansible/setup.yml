# Installs docker and starts the docker-compose.yml services (postgres).
# Usage: ansible-playbook -i inventory.ini setup.yml
- name: Setup docker compose
  hosts: web
  become: true
  vars:
    app_dir: /opt/daily-bingo
  tasks:
    - name: Install docker
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2]
        update_cache: true

    - name: Create app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory

    - name: Copy docker-compose.yml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker-compose.yml"
        dest: "{{ app_dir }}/docker-compose.yml"

    - name: Start services
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ app_dir }}"
      register: compose
      changed_when: "'Started' in compose.stderr or 'Created' in compose.stderr or 'Recreated' in compose.stderr"
