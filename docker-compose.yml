services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER:     daily-bingo
      POSTGRES_PASSWORD: daily-bingo
      POSTGRES_DB:       daily-bingo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
